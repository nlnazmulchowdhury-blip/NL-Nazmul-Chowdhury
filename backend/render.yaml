services:
  - type: web
    name: proconverterbd-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn proconverterbd.wsgi --workers 4 --timeout 120 --access-logfile - --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Manually set in Render Dashboard -> Supabase connection string
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://YOUR_VERCEL_APP.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://YOUR_VERCEL_APP.vercel.app"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
